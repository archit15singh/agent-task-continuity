[project]
name = "agent-task-continuity"
version = "0.1.0"
description = "Worktree Ledger keeps checkpoints and verification records for coding-agent handoffs"
requires-python = ">=3.11"
readme = "README.md"

[project.urls]
Repository = "https://github.com/archit15singh/worktree-ledger"
Documentation = "https://github.com/archit15singh/worktree-ledger/blob/main/docs/usage.md"
Issues = "https://github.com/archit15singh/worktree-ledger/issues"

[project.scripts]
continuity = "continuity.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["continuity"]

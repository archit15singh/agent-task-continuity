[project]
name = "agent-task-continuity"
version = "0.1.0"
description = "Local, cross-agent continuity for Git-backed coding work"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
continuity = "continuity.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["continuity"]
